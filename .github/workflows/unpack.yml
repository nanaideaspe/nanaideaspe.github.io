name: Unpack images
on:
  push:
    paths: ["img-zip.b64.txt"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode and unzip
        run: |
          base64 -d img-zip.b64.txt > /tmp/img.zip
          unzip -o /tmp/img.zip -d .
          rm img-zip.b64.txt
          ls img | wc -l
      - name: Commit images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "img: desempaquetar imágenes" || echo "nothing to commit"
          git push
